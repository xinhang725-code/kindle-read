<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle Read</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="app-header"><button id="back" class="compact">书架</button><span id="app-name">正在打开…</span><button id="exit" class="compact">退出</button></header>
<main id="main">
 <section id="shelf" class="view hidden"><div class="eyebrow">我的书架</div><h1 id="shelf-name">阅读</h1><p id="intro"></p><div id="toolbar" class="toolbar"></div><div id="books"></div><nav id="shelf-pages" class="list-pages"></nav><button id="local-open" class="quiet">导入本地文本</button><p class="small"><a href="source.tar.gz">源代码与许可证</a></p></section>
 <section id="browse" class="view hidden"><div class="eyebrow">发现好故事</div><h1 id="browse-title">书城</h1><div id="rank-tabs" class="toolbar"></div><form id="search-form" class="hidden"><label for="search-query">书名或作者</label><input id="search-query" maxlength="80" autocomplete="off"><button type="submit">搜索</button></form><div id="results"></div><nav id="search-pages" class="list-pages"></nav></section>
 <section id="add" class="view hidden"><h1>添加作品</h1><p>输入长佩官方作品链接或作品编号。</p><form id="add-form"><label for="book-url">作品链接或编号</label><input id="book-url" type="text" required><button type="submit">添加到书架</button></form></section>
 <section id="local" class="view hidden"><h1>导入本地文本</h1><p>阅读自有文本。</p><form id="local-form"><label for="local-title">标题</label><input id="local-title" required maxlength="150"><label for="local-text">UTF-8 正文（最多 2 MiB）</label><textarea id="local-text" rows="8" required></textarea><button type="submit">导入</button></form></section>
 <section id="catalog" class="view hidden"><div class="eyebrow">目录</div><h1 id="catalog-title"></h1><div id="catalog-actions" class="toolbar"></div><div id="chapters"></div><nav id="catalog-pages" class="list-pages"></nav></section>
 <section id="login" class="view hidden"><div class="eyebrow">扫码后开始阅读</div><h1 id="login-title">登录微信读书</h1><p id="login-instructions"></p><p id="login-status">正在获取二维码…</p><img id="qr" class="hidden" alt="登录二维码" width="420" height="420"><form id="otp-form" class="hidden"><label for="otp">手机上显示的四位验证码</label><input id="otp" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"><button type="submit">确认验证码</button></form><div class="toolbar"><button id="login-refresh">刷新二维码</button><button id="login-cancel">取消登录</button></div><p id="login-help" class="small"></p></section>
 <section id="reader" class="view hidden"><div id="chapter-heading"><button id="reader-return" class="cp-only">返回</button><button id="catalog-open">目录</button><div id="chapter-title"></div></div><article id="page" tabindex="0" aria-label="阅读正文，左侧上一页，中间显示工具栏，右侧下一页"></article><article id="measure" aria-hidden="true"></article><div id="reading-position" class="cp-only"></div><div id="reading-progress" class="cp-only"></div><nav id="reader-nav"><button id="previous">上一页</button><button id="font-down" class="compact" aria-label="减小字号">A−</button><span id="page-number"></span><button id="font-up" class="compact" aria-label="增大字号">A+</button><button id="next">下一页</button><button id="settings-open" class="cp-only">排版设置</button></nav><div id="reader-settings" class="hidden"><h2>阅读设置</h2><div id="spacing-controls" class="toolbar"></div><div id="margin-controls" class="toolbar"></div><div class="toolbar"><button id="bold-toggle">加粗：关</button><button id="indent-toggle">首行缩进：开</button><button id="settings-close">完成</button></div><p class="small">前光请使用 Kindle 系统设置。</p></div></section>
</main>
<div id="status" role="status" aria-live="polite" class="hidden"></div>
<script src="reader.js"></script><script src="app.js"></script>
</body></html>
