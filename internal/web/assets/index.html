<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle Read</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><button id="back" class="compact">书架</button><span id="app-name">正在打开…</span><button id="exit" class="compact">退出</button></header>
<main id="main">
 <section id="shelf" class="view"><div class="eyebrow">我的书架</div><h1 id="shelf-name">阅读</h1><p id="intro"></p><div id="toolbar" class="toolbar"></div><div id="books"></div><button id="local-open" class="quiet">导入本地文本</button><p class="small">开发测试版 0.1 · 设备兼容性待验证</p><p class="small"><a href="source.tar.gz">源代码与许可证</a> · MiuRead 独立移植版，与上游插件分别维护。</p></section>
 <section id="add" class="view hidden"><h1>添加作品</h1><p>粘贴本平台官方作品或公开章节链接。</p><form id="add-form"><label for="book-url">作品链接</label><input id="book-url" type="url" required><button type="submit">添加到书架</button></form></section>
 <section id="local" class="view hidden"><h1>导入本地文本</h1><p>仅用于阅读自有文本和验证阅读器。它不会被计作平台作品。</p><form id="local-form"><label for="local-title">标题</label><input id="local-title" required maxlength="150"><label for="local-text">UTF-8 正文（最多 2 MiB）</label><textarea id="local-text" rows="8" required></textarea><button type="submit">导入</button></form></section>
 <section id="catalog" class="view hidden"><div class="eyebrow">目录</div><h1 id="catalog-title"></h1><div id="chapters"></div></section>
 <section id="login" class="view hidden"><h1>登录微信读书</h1><p id="login-status">用微信扫描二维码并确认授权。</p><img id="qr" alt="微信读书登录二维码" width="300" height="300"><form id="otp-form" class="hidden"><label for="otp">手机上显示的四位验证码</label><input id="otp" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"><button type="submit">确认验证码</button></form><button id="login-cancel">取消登录</button></section>
 <section id="reader" class="view hidden"><div id="chapter-heading"><button id="catalog-open">目录</button><div id="chapter-title"></div></div><article id="page"></article><article id="measure" aria-hidden="true"></article><nav id="reader-nav"><button id="previous">上一页</button><button id="font-down" class="compact" aria-label="减小字号">A−</button><span id="page-number"></span><button id="font-up" class="compact" aria-label="增大字号">A+</button><button id="next">下一页</button></nav></section>
</main>
<div id="status" role="status" aria-live="polite" class="hidden"></div>
<script src="reader.js"></script><script src="app.js"></script>
</body></html>
