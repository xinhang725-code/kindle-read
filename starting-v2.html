/* Independent of external scripts: a failed ready handshake must self-close. */
(function () {
  var until = Date.now() + 45000;
  function check() {
    if (window.WRStartingActive) return;
    try {
      var token = nativeBridge.getStringLipcProperty('com.isword.weread.launch', 'token');
      var phase = nativeBridge.getStringLipcProperty('com.isword.weread.launch', 'phase');
      if (!/^[0-9a-f]{32}$/.test(token) || phase !== token + ':waiting' || Date.now() >= until) {
        nativeBridge.dismissMe(); return;
      }
    } catch (error) { nativeBridge.dismissMe(); return; }
    setTimeout(check, 150);
  }
  setTimeout(check, 150);
}());
</script>
